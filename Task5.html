<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task5 - image in table</title>
</head>

<body>

    <h1>Image in table</h1>
    <hr>

    <h3>What are your favorite pets?</h3>

    <table border="1">
        <thead>
            <tr>
                <th>Pet Image</th>
                <th>More Facts about (as a Link)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td align="center">
                    <img src="./images/Elephant.jpg" alt="Elephant" width="300" height="300">
                </td>
                <td valign="middle">
                    <a href="https://en.wikipedia.org/wiki/Elephant">Elephant</a>
                </td>
            </tr>
            <tr>
                <td align="center">
                    <img src="./images/Peacock.jpg" alt="peacock" width="300" height="300">
                </td>
                <td valign="middle">
                    <a href="https://en.wikipedia.org/wiki/Peafowl">Peacock</a>
                </td>
            </tr>
            <tr>
                <td align="center">
                    <img src="./images/Cat.jpg" alt="Cats" width="300" height="300">
                </td>
                <td valign="middle">
                    <a href="https://en.wikipedia.org/wiki/Cat">Cats</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
